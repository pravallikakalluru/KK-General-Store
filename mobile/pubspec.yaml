name: grocery_store_app
description: "Grocery / general-store ordering app (owner + customer roles)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Secure token storage (native platforms: Keychain/Keystore)
  flutter_secure_storage: ^9.2.2
  # Token storage on web: flutter_secure_storage's web backend needs the
  # Web Crypto API, which browsers only expose in a "secure context"
  # (HTTPS or the literal host "localhost") — it throws on a plain-HTTP
  # LAN address. shared_preferences (backed by localStorage) has no such
  # restriction, so it's used for web instead. See ApiClient.
  shared_preferences: ^2.3.2

  # Images (product photos are shown via Flutter's built-in Image.network —
  # see widgets/product_image.dart)
  image_picker: ^1.1.2

  # PDF receipt generation + printing/sharing
  pdf: ^3.11.0
  printing: ^5.13.1

  # WhatsApp deep link / external URL launching
  url_launcher: ^6.3.0

  # Formatting (currency, dates)
  intl: ^0.19.0

  # Utilities
  path_provider: ^2.1.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icon/

# Run `dart run flutter_launcher_icons` after changing assets/icon/icon.png
# to regenerate every platform's launcher icon from this one source image.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Android adaptive icons (8+) mask the foreground layer into whatever
  # shape the OEM launcher uses (circle, squircle, rounded square, ...) and
  # only guarantee the inner ~66% "safe zone" survives that mask - passing
  # the same full-bleed image used for the flat legacy icon would get its
  # edges (the cart wheels, the outer rim) clipped. icon_foreground.png is
  # the same logo scaled down with transparent padding so it sits safely
  # inside that zone.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2E7D32"
