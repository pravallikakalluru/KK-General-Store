name: grocery_store_app
description: "Grocery / general-store ordering app (owner + customer roles)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Secure token storage (native platforms: Keychain/Keystore)
  flutter_secure_storage: ^9.2.2
  # Token storage on web: flutter_secure_storage's web backend needs the
  # Web Crypto API, which browsers only expose in a "secure context"
  # (HTTPS or the literal host "localhost") — it throws on a plain-HTTP
  # LAN address. shared_preferences (backed by localStorage) has no such
  # restriction, so it's used for web instead. See ApiClient.
  shared_preferences: ^2.3.2

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # PDF receipt generation + printing/sharing
  pdf: ^3.11.0
  printing: ^5.13.1

  # WhatsApp deep link / external URL launching
  url_launcher: ^6.3.0

  # Formatting (currency, dates)
  intl: ^0.19.0

  # Utilities
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
